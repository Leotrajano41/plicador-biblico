name: Copy HTML
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - run: cp "gerador narrativas biblicas.html" index.html
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add index.html
          git commit -m "update index" || echo "nothing to commit"
          git push
